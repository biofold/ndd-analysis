name: ndd_analysis

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - coreutils
  - numpy=2.2.4
  - scipy=1.15.2
  - pandas=2.2.3
  - matplotlib-base=3.10.1
  - matplotlib-venn=1.1.2
  - seaborn=0.13.2
  - statsmodels=0.14.4
  - gseapy=1.1.6
  - scikit-learn        # ROC/PR curves in utils/plotting/roc-pr.py and the MOE validation scripts
  - upsetplot           # utils/plotting/upset-plot.py (reviewer point R2.3)
  - openjdk             # Java runtime for OWLTools map2slim in utils/enrichment/build_goslim_gmt.py (only to rebuild libs/GOslim_*; OWLTools itself is downloaded, see data/README.md)
  - pyyaml=6.0.2
  - requests
  - certifi
  - packaging
  - openpyxl          # often useful with pandas
  - pip
